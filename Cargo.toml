[package]
name = "polymarket-us"
version = "0.7.0"
edition = "2021"
rust-version = "1.86"
# Resolver v3 is MSRV-aware: it prefers dependency versions whose own
# `rust-version` the floor above can actually build. Edition 2021 would
# otherwise default to v2, which ignores `rust-version` entirely — that is how
# a routine `cargo update` pulled in icu crates requiring rustc 1.88 and broke
# the MSRV job.
resolver = "3"
authors = ["Michael Bordash <michaelbordash@gmail.com>"]
description = "Unofficial Rust SDK for the Polymarket US Retail API"
license = "MIT"
repository = "https://github.com/mbordash/polymarket-us"
homepage = "https://github.com/mbordash/polymarket-us"
readme = "README.md"
keywords = ["polymarket", "sdk", "trading", "api"]
categories = ["api-bindings", "finance"]

# Version floors here are verified minimums, not guesses: CI resolves every
# direct dependency down to the version named below and runs the test suite
# against it. Raise one only with a reason, and expect the job to tell you if it
# is wrong in either direction.
[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
http = "1.1"
# `rustls` brings its own verifier: as of reqwest 0.13.4 the roots come from the
# platform verifier, and the separate `webpki-roots` feature no longer exists.
# Asking for it pinned the resolver to 0.13.1 rather than failing, which is a
# quiet way to conflict with any consumer that needs a newer reqwest.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "query",
    "rustls",
    "http2",
    "charset",
    "system-proxy",
] }
serde = { version = "1.0.103", features = ["derive"] }
serde_json = "1.0.25"
thiserror = "2.0.7"
tokio = { version = "1.29", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.29", features = ["macros", "rt-multi-thread"] }
# `handshake` enables the server side (accept_async) so tests can stand up a
# real WebSocket peer. Not needed by the library itself.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[package]
name = "polymarket-us"
version = "0.5.0"
edition = "2021"
rust-version = "1.86"
authors = ["Michael Bordash <michaelbordash@gmail.com>"]
description = "Unofficial Rust SDK for the Polymarket US Retail API"
license = "MIT"
repository = "https://github.com/mbordash/polymarket-us"
homepage = "https://github.com/mbordash/polymarket-us"
readme = "README.md"
keywords = ["polymarket", "sdk", "trading", "api"]
categories = ["api-bindings", "finance"]

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
    "webpki-roots",
    "http2",
    "charset",
    "system-proxy",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `handshake` enables the server side (accept_async) so tests can stand up a
# real WebSocket peer. Not needed by the library itself.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

